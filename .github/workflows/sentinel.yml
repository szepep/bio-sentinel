name: Bio-Sentinel RLHF Engine Scheduled Pipeline

on:
  schedule:
    # Run every 6 hours (at minute 0 of hours 0, 6, 12, 18)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual triggering of the analysis sequence from GHA Console
    inputs:
      debug_mode:
        description: 'Enable verbose debug tracing'
        required: false
        default: 'false'

jobs:
  run-analyser:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment 3.11
      uses: actions/setup-python@v4
      with:
        python-node: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Bio-Sentinel Core Pipeline
      env:
        # Pass secrets securely into environmental variables
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        GARMIN_SESSION: ${{ secrets.GARMIN_SESSION }}
        GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
      run: |
        python main.py
